<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Exam Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="glass-panel auth-container">
    <div class="text-center mb-4">
        <h1 style="color: var(--primary-color);">Create Account</h1>
        <p class="text-muted">Join the portal to register for exams.</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/signup}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Choose a username">
            <span class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Create a password">
            <span class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <div class="text-center mt-4 text-muted">
        Already have an account? <a th:href="@{/login}" style="color: var(--primary-color); font-weight: 500;">Login</a>
    </div>
</div>
</body>
</html>
