<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="glass-panel auth-container">
    <div class="text-center mb-4">
        <h1 style="color: var(--primary-color);">Exam Portal</h1>
        <p class="text-muted">Welcome back! Please login to your account.</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>
    <div th:if="${param.success}" class="alert alert-success">
        Account created successfully. Please login.
    </div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/login}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" required autofocus placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="text-center mt-4 text-muted">
        Don't have an account? <a th:href="@{/signup}" style="color: var(--primary-color); font-weight: 500;">Sign up</a>
    </div>
</div>
</body>
</html>
